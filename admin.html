        const Page13 = ({ data, updateData, selectedMatchSport, setSelectedMatchSport }) => {

            const activeIntlSports = data.activities.find(a => a.id === 'intl')?.selected ? data.intlSports : [];

            const validSports = allSports.filter(sport => { const count = activeTeams.filter(t => submissions[sport.key]?.[t.id]).length; return count >= 1; });

            const currentMatches = (Array.isArray(rawMatches) ? rawMatches : Object.values(rawMatches)).filter(m => m && typeof m === 'object');
            
            const standingsOverrides = data.standingsOverrides || {};
            const currentOverrides = standingsOverrides[currentSportKey] || {};
            
            const updateMatches = (newMatches) => { updateData('matchSchedules', { ...data.matchSchedules, [currentSportKey]: newMatches }); };
            const updateOverride = (group, team, field, value) => {
                const newOverrides = { ...currentOverrides };
                if (!newOverrides[group]) newOverrides[group] = {};
                if (!newOverrides[group][team]) newOverrides[group][team] = {};
                if (value === '') { delete newOverrides[group][team][field]; } else { newOverrides[group][team][field] = parseInt(value) || 0; }
                updateData('standingsOverrides', { ...standingsOverrides, [currentSportKey]: newOverrides });
            };
            
            const addMatch = () => { const newMatch = { id: Date.now().toString(), date: '', time: '', matchNo: '', group: '', home: '', away: '', homeScore: '', awayScore: '', note: '' }; updateMatches([...currentMatches, newMatch]); };

            currentMatches.forEach(m => {

                if (!calculatedStandings[g]) calculatedStandings[g] = {};

                    if(calculatedStandings[g][m.away]) { calculatedStandings[g][m.away].p += 1; calculatedStandings[g][m.away].gf += as; calculatedStandings[g][m.away].ga += hs; }

                        if(calculatedStandings[g][m.away]) { calculatedStandings[g][m.away].l += 1; }

                        if(calculatedStandings[g][m.home]) { calculatedStandings[g][m.home].l += 1; }

                                            <tr><th className="p-2 w-24 md:w-32 rounded-tl-lg">ว/ด/ป</th><th className="p-2 w-16 md:w-24">เวลา</th><th className="p-2 w-12 md:w-16">คู่ที่</th><th className="p-2 text-yellow-300 w-16 md:w-20">สาย</th><th className="p-2 text-right min-w-[140px] md:min-w-[200px]">ทีมเหย้า</th><th className="p-2 bg-black/20 w-28 md:w-32">ผล</th><th className="p-2 text-left min-w-[140px] md:min-w-[200px]">ทีมเยือน</th><th className="p-2 min-w-[80px] md:min-w-[120px]">หมายเหตุ</th><th className="p-2 w-10 rounded-tr-lg no-print"></th></tr>
                                        </thead>
                                        <tbody>
                                            {currentMatches.length === 0 ? (
                                                <tr><td colSpan={9} className="py-10 text-slate-400 font-bold text-base bg-white/40 rounded-b-lg">ยังไม่มีโปรแกรมการแข่งขัน (กดปุ่ม + เพิ่มคู่แข่ง ด้านขวาบน)</td></tr>
                                            ) : currentMatches.map((m, idx) => {
                                                const matchId = m.id || `m_${idx}`;
                                                return (
                                                <tr key={matchId} className="border-b border-slate-200/60 hover:bg-indigo-50/50 bg-white/70 transition-colors">
                                                    <td className="p-1"><input type="date" className="w-full min-w-[90px] md:min-w-[120px] p-1.5 md:p-2 text-[10px] md:text-xs font-bold border border-slate-200 rounded-lg focus:border-indigo-400 outline-none text-center bg-white/90 shadow-sm cursor-pointer" value={m.date || ''} onChange={e => updateMatch(m.id, 'date', e.target.value)} /></td>
                                                    <td className="p-1"><input type="text" placeholder="16.00" className="w-full min-w-[60px] md:min-w-[80px] p-1.5 md:p-2 text-[10px] md:text-sm font-bold border border-slate-200 rounded-lg focus:border-indigo-400 outline-none text-center bg-white/90 shadow-sm" value={m.time || ''} onChange={e => updateMatch(m.id, 'time', e.target.value)} /></td>
                                                    <td className="p-1"><input type="text" placeholder="1" className="w-full min-w-[40px] md:min-w-[50px] p-1.5 md:p-2 text-[10px] md:text-sm font-black text-indigo-700 border border-slate-200 rounded-lg focus:border-indigo-400 outline-none text-center bg-indigo-50/80 shadow-sm" value={m.matchNo || ''} onChange={e => updateMatch(m.id, 'matchNo', e.target.value)} /></td>

                                                    <td className="p-1 text-right"><input list={`teams-list-${currentSportKey}`} placeholder="ทีมเหย้า" className="w-full min-w-[140px] md:min-w-[200px] p-1.5 md:p-2 text-xs md:text-sm font-bold border border-slate-200 rounded-lg focus:border-indigo-400 outline-none text-right bg-white shadow-sm" value={m.home || ''} onChange={e => updateMatch(m.id, 'home', e.target.value)} /></td>
                                                    <td className="p-1 font-black flex items-center justify-center bg-slate-100/50 rounded-lg mx-1 min-w-[100px] md:min-w-[120px]"><input type="number" min="0" className="w-10 md:w-12 p-1.5 md:p-2 text-sm md:text-base border border-slate-300 rounded-md text-center focus:border-indigo-500 outline-none shadow-inner bg-white" value={m.homeScore !== undefined ? m.homeScore : ''} onChange={e => updateMatch(m.id, 'homeScore', e.target.value)} /><span className="text-slate-400 mx-1 md:mx-2">-</span><input type="number" min="0" className="w-10 md:w-12 p-1.5 md:p-2 text-sm md:text-base border border-slate-300 rounded-md text-center focus:border-indigo-500 outline-none shadow-inner bg-white" value={m.awayScore !== undefined ? m.awayScore : ''} onChange={e => updateMatch(m.id, 'awayScore', e.target.value)} /></td>
                                                    <td className="p-1 text-left"><input list={`teams-list-${currentSportKey}`} placeholder="ทีมเยือน" className="w-full min-w-[140px] md:min-w-[200px] p-1.5 md:p-2 text-xs md:text-sm font-bold border border-slate-200 rounded-lg focus:border-indigo-400 outline-none bg-white shadow-sm" value={m.away || ''} onChange={e => updateMatch(m.id, 'away', e.target.value)} /></td>
                                                    <td className="p-1"><input type="text" placeholder="หมายเหตุ..." className="w-full min-w-[80px] md:min-w-[120px] p-1.5 md:p-2 text-[10px] md:text-sm border border-slate-200 rounded-lg focus:border-indigo-400 outline-none bg-white/90 shadow-sm" value={m.note || ''} onChange={e => updateMatch(m.id, 'note', e.target.value)} /></td>
                                                    <td className="p-1 text-center no-print"><button onClick={() => removeMatch(m.id)} className="text-slate-400 hover:text-red-500 p-1 md:p-2 rounded-lg transition-colors bg-white shadow-sm border border-slate-200"><Icons.Trash2 className="w-4 h-4 md:w-5 md:h-5"/></button></td>
                                                </tr>
                                            )})}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div className="w-full lg:w-[320px] xl:w-[380px] shrink-0 flex flex-col bg-white/60 rounded-2xl border border-white/50 shadow-inner overflow-hidden min-w-0">
                                <div className="px-4 py-3 bg-gradient-to-r from-orange-500 to-yellow-500 text-white font-black flex items-center justify-between border-b-2 border-white/30"><div className="flex items-center"><Icons.Calculator className="w-5 h-5 mr-2"/> ตารางคะแนน (คำนวณเบื้องต้น)</div></div>
                                <div className="overflow-x-auto w-full p-3 space-y-4 max-h-[65vh]">
                                    {Object.keys(calculatedStandings).length === 0 ? (
                                        <div className="text-center text-sm text-slate-400 font-bold mt-10">เมื่อกรอกสายและชื่อทีม<br/>ตารางคะแนนจะปรากฏที่นี่ครับ</div>
                                    ) : (
                                        Object.keys(calculatedStandings).sort().map(groupName => {
                                            const groupStats = calculatedStandings[groupName];
                                            const sortedTeams = Object.values(groupStats).sort((a, b) => {
                                                const aPts = currentOverrides[groupName]?.[a.team]?.pts ?? a.pts; const bPts = currentOverrides[groupName]?.[b.team]?.pts ?? b.pts;
                                                if (bPts !== aPts) return bPts - aPts;
                                                const aGD = (currentOverrides[groupName]?.[a.team]?.gf ?? a.gf) - (currentOverrides[groupName]?.[a.team]?.ga ?? a.ga);
                                                const bGD = (currentOverrides[groupName]?.[b.team]?.gf ?? b.gf) - (currentOverrides[groupName]?.[b.team]?.ga ?? b.ga);
                                                return bGD - aGD;
                                            });
                                            return (
                                                <div key={groupName} className="bg-white/95 rounded-xl shadow-md border border-slate-200 overflow-hidden min-w-[320px]">
                                                    <div className="bg-slate-800 text-white text-xs font-black py-2 px-3 flex justify-between items-center"><span>กลุ่ม / สาย: <span className="text-yellow-400 text-sm ml-1">{groupName}</span></span><span className="text-[10px] font-normal opacity-70 no-print">* พิมพ์แก้แต้มเองได้</span></div>
                                                    <table className="w-full text-center text-[10px] md:text-sm">
                                                        <thead className="bg-slate-100 text-slate-600 font-bold border-b border-slate-200"><tr><th className="p-1 text-left pl-2">ทีม</th><th className="p-1 w-6">ข</th><th className="p-1 w-6">ช</th><th className="p-1 w-6">ส</th><th className="p-1 w-6">พ</th><th className="p-1 w-6">ด</th><th className="p-1 w-6">ส</th><th className="p-1 w-10 text-indigo-700">แต้ม</th></tr></thead>
                                                        <tbody>
                                                            {sortedTeams.map(t => {
                                                                const ov = currentOverrides[groupName]?.[t.team] || {};
                                                                return (
                                                                    <tr key={t.team} className="border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
                                                                        <td className="p-1.5 text-left pl-2 font-bold text-slate-800 truncate max-w-[100px]">{t.team}</td>
                                                                        <td className="p-0.5 border-l border-slate-100"><input type="number" min="0" className={`w-full text-center outline-none bg-transparent focus:bg-yellow-100 focus:ring-2 focus:ring-orange-300 rounded ${ov.p !== undefined ? 'text-orange-600 font-black' : ''}`} value={ov.p !== undefined ? ov.p : t.p} onChange={(e) => updateOverride(groupName, t.team, 'p', e.target.value)} /></td>
                                                                        <td className="p-0.5 bg-green-50/50"><input type="number" min="0" className={`w-full text-center outline-none bg-transparent focus:bg-yellow-100 focus:ring-2 focus:ring-orange-300 rounded ${ov.w !== undefined ? 'text-orange-600 font-black' : ''}`} value={ov.w !== undefined ? ov.w : t.w} onChange={(e) => updateOverride(groupName, t.team, 'w', e.target.value)} /></td>
                                                                        <td className="p-0.5 bg-yellow-50/50"><input type="number" min="0" className={`w-full text-center outline-none bg-transparent focus:bg-yellow-100 focus:ring-2 focus:ring-orange-300 rounded ${ov.d !== undefined ? 'text-orange-600 font-black' : ''}`} value={ov.d !== undefined ? ov.d : t.d} onChange={(e) => updateOverride(groupName, t.team, 'd', e.target.value)} /></td>
                                                                        <td className="p-0.5 bg-red-50/50"><input type="number" min="0" className={`w-full text-center outline-none bg-transparent focus:bg-yellow-100 focus:ring-2 focus:ring-orange-300 rounded ${ov.l !== undefined ? 'text-orange-600 font-black' : ''}`} value={ov.l !== undefined ? ov.l : t.l} onChange={(e) => updateOverride(groupName, t.team, 'l', e.target.value)} /></td>
                                                                        <td className="p-0.5 border-l border-slate-100"><input type="number" min="0" className={`w-full text-center outline-none bg-transparent focus:bg-yellow-100 focus:ring-2 focus:ring-orange-300 rounded ${ov.gf !== undefined ? 'text-orange-600 font-black' : ''}`} value={ov.gf !== undefined ? ov.gf : t.gf} onChange={(e) => updateOverride(groupName, t.team, 'gf', e.target.value)} /></td>
                                                                        <td className="p-0.5"><input type="number" min="0" className={`w-full text-center outline-none bg-transparent focus:bg-yellow-100 focus:ring-2 focus:ring-orange-300 rounded ${ov.ga !== undefined ? 'text-orange-600 font-black' : ''}`} value={ov.ga !== undefined ? ov.ga : t.ga} onChange={(e) => updateOverride(groupName, t.team, 'ga', e.target.value)} /></td>
                                                                        <td className="p-0.5 bg-indigo-50 border-l border-indigo-100 font-black text-indigo-700 text-xs md:text-sm"><input type="number" min="0" className={`w-full text-center outline-none bg-transparent focus:bg-yellow-100 focus:ring-2 focus:ring-orange-300 rounded py-0.5 ${ov.pts !== undefined ? 'text-orange-600 font-black' : ''}`} value={ov.pts !== undefined ? ov.pts : t.pts} onChange={(e) => updateOverride(groupName, t.team, 'pts', e.target.value)} /></td>
                                                                    </tr>
                                                                );
                                                            })}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const Page14 = ({ data, updateData, selectedMedalSport, setSelectedMedalSport }) => {
            const activeTeams = [ ...data.villages.filter(v => v.isParticipating !== false), ...(data.customTeams || []) ];
            const medalSettings = data.medalSettings || []; const sportMedalWinners = data.sportMedalWinners || {};
            const activeIntlSports = data.activities.find(a => a.id === 'intl')?.selected ? data.intlSports : [];
            const activeTradSports = data.activities.find(a => a.id === 'trad')?.selected ? [...data.tradSports.filter(s => s.selected), ...(data.customTradSports || [])] : [];
            const allSports = [ ...activeIntlSports.map(s => ({ ...s, type: 'intl', key: `intl_${s.id}` })), ...activeTradSports.map((s, i) => ({ ...s, type: 'trad', key: `trad_${s.id || 'c'+i}` })) ];
            
            const submissions = data.teamSubmissions || {};
            const validSports = allSports.filter(sport => { const count = activeTeams.filter(t => submissions[sport.key]?.[t.id]).length; return count >= 1; });
            let currentSportKey = selectedMedalSport;
            if (!currentSportKey || !validSports.find(s => s.key === currentSportKey)) { currentSportKey = validSports.length > 0 ? validSports[0].key : null; }
            
            const currentSportWinners = sportMedalWinners[currentSportKey] || {};
            let teamsToShow = activeTeams.filter(t => submissions[currentSportKey]?.[t.id]);
            if (teamsToShow.length === 0) { teamsToShow = activeTeams; }

            const addMedalSetting = () => { const newId = `m_${Date.now()}`; updateData('medalSettings', [...medalSettings, { id: newId, name: 'รางวัลใหม่', points: 0 }]); };
            const updateMedalSetting = (id, field, value) => { const parsedValue = field === 'points' ? (parseInt(value) || 0) : value; updateData('medalSettings', medalSettings.map(m => m.id === id ? { ...m, [field]: parsedValue } : m)); };
            const removeMedalSetting = (id) => { updateData('medalSettings', medalSettings.filter(m => m.id !== id)); };
            
            const handleWinnerChange = (sportKey, medalId, index, val) => { 
                const sportData = sportMedalWinners[sportKey] || {}; 
                let rawW = sportData[medalId] || [];
                let winners = Array.isArray(rawW) ? [...rawW] : (typeof rawW === 'string' ? [rawW] : Object.values(rawW));
                winners[index] = val; 
                updateData('sportMedalWinners', { ...sportMedalWinners, [sportKey]: { ...sportData, [medalId]: winners } }); 
            };
            const addCoWinner = (sportKey, medalId) => { 
                const sportData = sportMedalWinners[sportKey] || {}; 
                let rawW = sportData[medalId] || [];
                let winners = Array.isArray(rawW) ? [...rawW] : (typeof rawW === 'string' ? [rawW] : Object.values(rawW));
                winners.push(''); 
                updateData('sportMedalWinners', { ...sportMedalWinners, [sportKey]: { ...sportData, [medalId]: winners } }); 
            };
            const removeCoWinner = (sportKey, medalId, index) => { 
                const sportData = sportMedalWinners[sportKey] || {}; 
                let rawW = sportData[medalId] || [];
                let winners = Array.isArray(rawW) ? [...rawW] : (typeof rawW === 'string' ? [rawW] : Object.values(rawW));
                winners.splice(index, 1); 
                if (winners.length === 0) winners.push(''); 
                updateData('sportMedalWinners', { ...sportMedalWinners, [sportKey]: { ...sportData, [medalId]: winners } }); 
            };

            const derivedTallies = {}; 
            Object.entries(sportMedalWinners || {}).forEach(([sKey, medalsObj]) => {
                if(!medalsObj || typeof medalsObj !== 'object') return;
                Object.entries(medalsObj).forEach(([mId, teamIdsObj]) => { 
                    if(!teamIdsObj) return; 
                    const teamIds = Array.isArray(teamIdsObj) ? teamIdsObj : (typeof teamIdsObj === 'string' ? [teamIdsObj] : Object.values(teamIdsObj));
                    teamIds.forEach(tId => { 
                        if (tId && tId !== '' && tId !== 'empty') { 
                            if (!derivedTallies[tId]) derivedTallies[tId] = {}; 
                            derivedTallies[tId][mId] = (derivedTallies[tId][mId] || 0) + 1; 
                        } 
                    }); 
                });
            });

            const teamsWithScores = activeTeams.map(team => {
                const teamTally = derivedTallies[team.id] || {}; let totalPoints = 0;
                medalSettings.forEach(medal => { const count = teamTally[medal.id] || 0; totalPoints += count * medal.points; });
                return { ...team, totalPoints, tally: teamTally };
            });
            teamsWithScores.sort((a, b) => b.totalPoints - a.totalPoints);

            return (
                <div className="flex flex-col h-[calc(100vh-140px)] w-full max-w-7xl mx-auto space-y-4 pb-10">
                    <div className="flex flex-col md:flex-row items-start md:items-center justify-between border-b-2 border-amber-500 pb-2 mb-2 bg-white/70 backdrop-blur-md p-4 rounded-xl shadow-sm gap-3">
                        <div className="flex items-center space-x-3"><Icons.Award className="w-8 h-8 text-amber-600"/><h2 className="text-xl md:text-2xl font-black text-amber-950">สรุปเหรียญรางวัล</h2></div>
                        <div className="flex flex-wrap space-x-2 items-center w-full md:w-auto">
                            <button onClick={() => window.print()} className="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-bold shadow-md transition-colors flex items-center no-print w-full md:w-auto justify-center"><Icons.Printer className="w-5 h-5 mr-2"/> พิมพ์เอกสาร</button>
                        </div>
                    </div>
                    <div className="flex flex-col xl:flex-row gap-6 w-full">
                        <div className="w-full xl:w-[450px] shrink-0 flex flex-col gap-4 no-print">
                            <div className="bg-white/90 backdrop-blur-md rounded-2xl shadow-md border border-white/60 p-4 shrink-0">
                                <div className="flex items-center justify-between mb-3 border-b border-slate-200 pb-2">
                                    <h3 className="font-bold text-slate-700 flex items-center"><Icons.Palette className="w-5 h-5 mr-2 text-slate-400"/> 1. ตั้งค่ารางวัล และ คะแนน</h3>
                                    <button onClick={addMedalSetting} className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition-colors flex items-center"><Icons.Plus className="w-4 h-4 mr-1"/> เพิ่มรางวัล</button>
                                </div>
                                <div className="flex flex-col gap-2">
                                    {medalSettings.map((medal, idx) => (
                                        <div key={medal.id} className="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl p-1.5 shadow-sm focus-within:border-amber-400 transition-colors">
                                            <div className="flex items-center"><div className="w-6 h-6 bg-slate-200 rounded-full flex items-center justify-center font-bold text-slate-500 text-xs mx-1 shrink-0">{idx+1}</div><input type="text" className="w-24 md:w-32 px-2 py-1 outline-none font-bold text-slate-800 text-sm bg-transparent" value={medal.name} onChange={(e) => updateMedalSetting(medal.id, 'name', e.target.value)} placeholder="ชื่อรางวัล..."/></div>
                                            <div className="flex items-center"><div className="flex items-center bg-amber-100/50 rounded-lg px-1 md:px-2 py-1 border border-amber-200/50"><span className="text-[10px] md:text-xs font-bold text-amber-800 mr-1">แต้ม:</span><input type="number" min="0" className="w-8 outline-none font-black text-amber-600 bg-transparent text-center" value={medal.points} onChange={(e) => updateMedalSetting(medal.id, 'points', e.target.value)}/></div><button onClick={() => removeMedalSetting(medal.id)} className="p-1.5 ml-1 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"><Icons.Trash2 className="w-4 h-4"/></button></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-white/90 backdrop-blur-md rounded-2xl shadow-md border border-white/60 p-4 flex-1 flex flex-col">
                                <h3 className="font-bold text-indigo-900 flex items-center mb-3 pb-2 border-b border-slate-200"><Icons.Medal className="w-5 h-5 mr-2 text-indigo-500"/> 2. สรุปผลแยกรายประเภทกีฬา</h3>
                                {validSports.length > 0 ? (
                                    <>
                                        <select className="w-full text-base font-black text-indigo-900 bg-indigo-50 border-2 border-indigo-200 rounded-xl p-2 outline-none focus:border-amber-500 mb-4 cursor-pointer shadow-inner transition-colors" value={currentSportKey || ''} onChange={(e) => setSelectedMedalSport(e.target.value)}>
                                            {validSports.map(s => (<option key={s.key} value={s.key}>{s.type === 'trad' ? s.name : `${s.name} ${s.ageText||''} ${s.age!==null?s.age:''} ${s.unit||''}`.trim()} </option>))}
                                        </select>
                                        <div className="flex-1 space-y-3 overflow-y-auto max-h-[65vh]">
                                            {medalSettings.map(medal => {
                                                const rawW = currentSportWinners[medal.id] || []; 
                                                let winners = Array.isArray(rawW) ? [...rawW] : (typeof rawW === 'string' ? [rawW] : Object.values(rawW));
                                                if (winners.length === 0) winners = ['']; // ป้องกันแถวหาย
                                                return (
                                                    <div key={medal.id} className="bg-slate-50 p-3 rounded-xl border border-slate-200 shadow-sm">
                                                        <div className="flex justify-between items-center mb-2"><div className="font-bold text-slate-700 text-sm">{medal.name} <span className="text-amber-600 font-black">({medal.points} แต้ม)</span></div><button onClick={() => addCoWinner(currentSportKey, medal.id)} className="text-[10px] md:text-xs font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded-lg transition-colors flex items-center border border-blue-200"><Icons.Plus className="w-3 h-3 mr-1"/> เพิ่มแชมป์ร่วม</button></div>
                                                        <div className="space-y-2">
                                                            {winners.map((winnerId, idx) => {
                                                                return (
                                                                <div key={idx} className="flex items-center space-x-2">
                                                                    <div className="w-6 h-6 bg-white rounded-full flex items-center justify-center font-bold text-slate-400 text-xs shrink-0 shadow-sm border border-slate-200">{idx+1}</div>
                                                                    <select className="flex-1 text-xs md:text-sm font-bold text-slate-800 bg-white border border-slate-300 rounded-lg p-1.5 outline-none focus:border-amber-500 shadow-sm cursor-pointer truncate" value={winnerId || ''} onChange={e => handleWinnerChange(currentSportKey, medal.id, idx, e.target.value)}>
                                                                        <option value="" className="text-slate-400">-- เลือกหมู่บ้าน --</option>{teamsToShow.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                                                    </select>
                                                                    {winners.length > 1 && (<button onClick={() => removeCoWinner(currentSportKey, medal.id, idx)} className="text-slate-400 hover:text-red-500 p-1 md:p-1.5 bg-white border border-slate-200 rounded-lg shadow-sm"><Icons.Trash2 className="w-3 h-3 md:w-4 md:h-4"/></button>)}
                                                                </div>
                                                            )})}
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </>
                                ) : (<div className="text-center text-slate-400 text-sm mt-5 font-bold">ยังไม่มีการส่งทีมแข่งขัน<br/><span className="font-normal">(โปรดกลับไปส่งทีมในหน้า 11 ก่อนครับ)</span></div>)}
                            </div>
                        </div>
                        <div className="bg-white/95 backdrop-blur-xl rounded-2xl shadow-xl w-full flex flex-col overflow-hidden relative min-w-0">
                            <div className="bg-gradient-to-r from-amber-500 to-yellow-400 px-4 py-3 flex items-center justify-between border-b-2 border-white/30 print:bg-slate-200 print:text-black"><h3 className="font-black text-white text-base md:text-lg drop-shadow-md print:drop-shadow-none">3. ตารางคะแนนรวมกีฬา (คำนวณอัตโนมัติ)</h3></div>
                            <div className="overflow-x-auto w-full max-h-[65vh]">
                                <table className="w-full text-center border-collapse whitespace-nowrap min-w-[500px] relative">
                                    <thead className="bg-slate-50 sticky top-0 z-40 shadow-sm">
                                        <tr><th className="p-2 md:p-3 border-b border-r border-slate-200 text-slate-600 font-extrabold w-12 md:w-16 text-xs md:text-base align-middle">อันดับ</th><th className="p-2 md:p-3 border-b border-r border-slate-200 text-slate-600 font-extrabold text-left min-w-[120px] text-xs md:text-base align-middle">หมู่บ้าน / ทีม</th>
                                            {medalSettings.map(medal => (<th key={medal.id} className="p-2 md:p-3 border-b border-r border-slate-200 text-slate-700 font-bold min-w-[60px] md:min-w-[100px] align-middle"><div className="text-xs md:text-base">{medal.name}</div><div className="text-[9px] md:text-[10px] text-amber-600 font-black mt-0.5">({medal.points} แต้ม)</div></th>))}
                                            <th className="p-2 md:p-3 border-b border-slate-200 text-amber-700 font-black text-sm md:text-base bg-amber-50 w-24 md:w-32 align-middle">คะแนนรวม</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {teamsWithScores.map((team) => {
                                            let rank = teamsWithScores.findIndex(t => t.totalPoints === team.totalPoints) + 1;
                                            let displayRank = team.totalPoints > 0 ? rank : "-";
                                            return (
                                                <tr key={team.id} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                    <td className="p-1 md:p-2 border-r border-slate-100 font-bold text-slate-500 align-middle">{displayRank === 1 && team.totalPoints > 0 ? <Icons.Trophy className="w-4 h-4 md:w-6 md:h-6 mx-auto text-yellow-500"/> : displayRank}</td>
                                                    <td className="p-1 md:p-2 border-r border-slate-100 text-left pl-2 md:pl-4 align-middle"><div className="flex items-center"><div className="w-3 h-3 md:w-4 md:h-4 rounded-full mr-2 shadow-inner" style={{ backgroundColor: team.color !== '#cccccc' ? team.color : '#e2e8f0' }}></div><span className="font-bold text-slate-800 text-sm md:text-base">{team.name}</span></div></td>
                                                    {medalSettings.map(medal => (<td key={medal.id} className="p-1 md:p-2 border-r border-slate-100 bg-white/50 font-black text-slate-700 text-sm md:text-base align-middle">{team.tally[medal.id] || 0}</td>))}
                                                    <td className="p-1 md:p-2 bg-amber-50/50 border-l border-amber-100 font-black text-base md:text-lg text-amber-600 drop-shadow-sm align-middle">{team.totalPoints}</td>
                                                </tr>
                                            );
                                        })}
                                        {teamsWithScores.length === 0 && (<tr><td colSpan={medalSettings.length + 3} className="py-10 text-slate-400 text-xs md:text-sm">ไม่มีข้อมูลทีม โปรดตั้งค่าทีมส่งแข่งในหน้า 11 ก่อนครับ</td></tr>)}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const renderPage = ({ currentPage, data, updateData, currentYear, setCurrentYear, calMonth, setCalMonth, calYear, setCalYear, activeCalMode, setActiveCalMode, selectedDrawSport, setSelectedDrawSport, selectedMatchSport, setSelectedMatchSport, selectedMedalSport, setSelectedMedalSport, isLoaded, setCurrentPage }) => {
            switch(currentPage) {
                case 'page1': return <Page1 data={data} updateData={updateData} currentYear={currentYear} />; 
                case 'page2': return <Page2 data={data} updateData={updateData} calMonth={calMonth} setCalMonth={setCalMonth} calYear={calYear} setCalYear={setCalYear} activeCalMode={activeCalMode} setActiveCalMode={setActiveCalMode} />; 
                case 'page3': return <Page3 data={data} updateData={updateData} />; 
                case 'page4': return <Page4 data={data} updateData={updateData} />;
                case 'page5': return <Page5 data={data} updateData={updateData} />; 
                case 'page6': return <Page6 data={data} updateData={updateData} />; 
                case 'page7': return <Page7 data={data} updateData={updateData} />; 
                case 'page8': return <Page8 data={data} updateData={updateData} />;
                case 'page9': return <Page9 data={data} updateData={updateData} />; 
                case 'page10': return <Page10 data={data} updateData={updateData} calMonth={calMonth} setCalMonth={setCalMonth} calYear={calYear} setCalYear={setCalYear} activeCalMode={activeCalMode} setActiveCalMode={setActiveCalMode} />; 
                case 'page11': return <Page11 data={data} updateData={updateData} />; 
                case 'page12': return <Page12 data={data} updateData={updateData} selectedDrawSport={selectedDrawSport} setSelectedDrawSport={setSelectedDrawSport} />;
                case 'page13': return <Page13 data={data} updateData={updateData} selectedMatchSport={selectedMatchSport} setSelectedMatchSport={setSelectedMatchSport} />; 
                case 'page14': return <Page14 data={data} updateData={updateData} selectedMedalSport={selectedMedalSport} setSelectedMedalSport={setSelectedMedalSport} />;
                default: return <Dashboard currentYear={currentYear} handleYearChange={setCurrentYear} isLoaded={isLoaded} setCurrentPage={setCurrentPage} />;
            }
        };

        function App() {
            const [currentYear, setCurrentYear] = useState(() => localStorage.getItem('currentYear') || '2569');
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [calMonth, setCalMonth] = useState(new Date().getMonth());
            const [calYear, setCalYear] = useState(new Date().getFullYear());
            const [activeCalMode, setActiveCalMode] = useState(null); 
            const [selectedDrawSport, setSelectedDrawSport] = useState(null);
            const [selectedMatchSport, setSelectedMatchSport] = useState(null);
            const [selectedMedalSport, setSelectedMedalSport] = useState(null);
            const [data, setData] = useState(getInitialDataTemplate());
            const [isLoaded, setIsLoaded] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            useEffect(() => {
                localStorage.setItem('currentYear', currentYear);
                setIsLoaded(false);
                const dataRef = db.ref(`sportData_${currentYear}`);
                const listener = dataRef.on('value', (snapshot) => {
                    const cloudData = snapshot.val();
                    if (cloudData) { setData(sanitizeCloudData(cloudData)); } 
                    else { const template = getInitialDataTemplate(); dataRef.set(template); setData(template); }
                    setIsLoaded(true);
                });
                return () => dataRef.off('value', listener);
            }, [currentYear]);

            const updateData = (key, value) => {
                if (!isLoaded) return;
                setData(prev => {
                    const newData = { ...prev, [key]: value };
                    db.ref(`sportData_${currentYear}`).set(newData).catch(err => console.error("Firebase Error: ", err));
                    return newData;
                });
            };

            const menuItems = [
                { id: 'dashboard', icon: Icons.Home, label: 'หน้าแรก (สรุป)' },
                { id: 'page1', icon: Icons.Presentation, label: '1. หน้าปกการประชุม' },
                { id: 'page2', icon: Icons.CalendarDays, label: '2. กำหนดวันแข่งขัน' },
                { id: 'page3', icon: Icons.ListChecks, label: '3. เลือกกิจกรรม' },
                { id: 'page4', icon: Icons.Target, label: '4. กีฬาพื้นบ้าน' },
                { id: 'page5', icon: Icons.Users, label: '5. กีฬาสากล' },
                { id: 'page6', icon: Icons.MapPin, label: '6. สนามแข่งขัน' },
                { id: 'page7', icon: Icons.CheckCircle2, label: '7. คุณสมบัตินักกีฬา' },
                { id: 'page8', icon: Icons.Calculator, label: '8. งบประมาณรางวัล' },
                { id: 'page9', icon: Icons.Palette, label: '9. ตั้งค่าทีม/สีเสื้อ' },
                { id: 'page10', icon: Icons.Clock, label: '10. กำหนดการ' },
                { id: 'page11', icon: Icons.ListChecks, label: '11. สรุปส่งทีม' },
                { id: 'page12', icon: Icons.Trophy, label: '12. จับฉลากแบ่งสาย' },
                { id: 'page13', icon: Icons.ListChecks, label: '13. ตารางและผลแข่งขัน' },
                { id: 'page14', icon: Icons.Award, label: '14. สรุปเหรียญรางวัล' }
            ];

            return (
                <div className="h-screen w-screen flex text-slate-800 overflow-hidden bg-transparent">
                    {isSidebarOpen && currentPage !== 'dashboard' && (<div className="fixed inset-0 bg-slate-900/60 z-40 md:hidden backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)}></div>)}
                    <div className={`fixed md:static inset-y-0 left-0 w-72 bg-blue-950 text-slate-300 flex flex-col shadow-2xl transition-transform duration-300 z-50 shrink-0 no-print 
                        ${currentPage === 'dashboard' ? 'hidden md:flex md:-ml-72 md:opacity-0' : ''} 
                        ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-6 bg-blue-900 border-b border-blue-800 flex flex-col items-center justify-center text-center relative">
                            <button onClick={() => setIsSidebarOpen(false)} className="md:hidden absolute top-4 right-4 text-white/50 hover:text-white"><Icons.Plus className="w-6 h-6 rotate-45"/></button>
                            <img src="https://res.cloudinary.com/dygneumft/image/upload/v1673863188/%E0%B8%AA%E0%B8%B1%E0%B8%8D%E0%B8%A5%E0%B8%B1%E0%B8%81%E0%B8%A9%E0%B8%93%E0%B9%8C%E0%B8%81%E0%B8%B5%E0%B8%AC%E0%B8%B2%20%E0%B8%AD%E0%B8%9B%E0%B8%97.%2066/%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87_3_edtiil.png" alt="โลโก้กีฬา" className="w-20 h-20 object-contain mb-3 drop-shadow-md cursor-pointer hover:scale-105 transition-transform duration-300" onClick={() => setCurrentPage('dashboard')} />
                            <h2 className="text-2xl font-black text-white mb-3 cursor-pointer hover:text-orange-400 transition-colors" onClick={() => setCurrentPage('dashboard')}>กีฬาตำบลแม่พูล</h2>
                            <div className="flex items-center space-x-2 text-orange-300 bg-orange-900/40 px-4 py-1.5 rounded-full border border-orange-500/30 shadow-inner"><div className="w-2.5 h-2.5 rounded-full bg-orange-400 animate-pulse"></div><span className="text-sm font-bold tracking-wider">โหมดผู้ดูแลระบบ</span></div>
                        </div>
                        <div className="flex-1 overflow-y-auto py-3 scrollbar-hide space-y-1">
                            {menuItems.map((item) => {
                                if (item.id === 'dashboard') return null;
                                const isActive = currentPage === item.id;
                                return (
                                    <button key={item.id} onClick={() => { setCurrentPage(item.id); setIsSidebarOpen(false); }} className={`w-full text-left px-6 py-3.5 flex items-center space-x-4 transition-all ${isActive ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white border-r-4 border-yellow-300 font-bold shadow-md' : 'hover:bg-blue-900 hover:text-white border-r-4 border-transparent font-medium'}`}><item.icon className={`w-6 h-6 ${isActive ? 'text-white' : 'text-blue-400'}`} /><span className="text-sm md:text-base">{item.label.split('.')[1] ? item.label.split('.')[1].trim() : item.label}</span></button>
                                );
                            })}
                        </div>
                        <div className="p-5 border-t border-blue-900 bg-blue-950 flex flex-col gap-3">
                             <button onClick={() => setCurrentPage('dashboard')} className="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-white font-bold transition-all shadow-md flex items-center justify-center space-x-2 border border-slate-700"><Icons.Home className="w-5 h-5"/> <span>กลับหน้าหลัก</span></button>
                             <button onClick={() => window.location.href = "index.html"} className="w-full py-2 bg-red-900/50 hover:bg-red-800 rounded-xl text-red-200 hover:text-white text-sm font-bold transition-all shadow-sm flex items-center justify-center space-x-2 border border-red-800/50"><Icons.Lock className="w-4 h-4"/> <span>ออกจากระบบ Admin</span></button>
                        </div>
                    </div>
                    <div className="flex-1 h-full relative flex flex-col bg-slate-50/20 min-w-0">
                        {currentPage !== 'dashboard' && (
                        <div className="bg-white/95 backdrop-blur-md px-4 md:px-8 py-3 md:py-4 shadow-sm flex justify-between items-center z-30 border-b border-slate-200 no-print">
                            <div className="flex items-center space-x-2 md:space-x-3">
                                <button onClick={() => setIsSidebarOpen(true)} className="md:hidden p-2 bg-blue-100 hover:bg-blue-200 text-blue-800 rounded-lg transition-colors"><Icons.Menu className="w-5 h-5"/></button>
                                <span className="bg-blue-100 text-blue-800 px-3 py-1.5 md:px-5 md:py-2 rounded-full border border-blue-200 shadow-sm text-sm md:text-base font-black">ครั้งที่ {data.meetingNo}/{currentYear}</span>
                                <div className={`hidden md:flex items-center px-4 py-2 rounded-full font-bold text-xs shadow-inner transition-colors ${isLoaded ? 'bg-green-100 text-green-700 border border-green-300' : 'bg-orange-100 text-orange-700 border border-orange-300 animate-pulse'}`}>{isLoaded ? <><Icons.CheckCircle2 className="w-4 h-4 mr-1.5"/> ออนไลน์</> : <><Icons.Clock className="w-4 h-4 mr-1.5"/> กำลังเชื่อมต่อ...</>}</div>
                            </div>
                            <div className="flex space-x-2 md:space-x-4">
                                {currentPage !== 'page1' && (<button onClick={() => { const idx = menuItems.findIndex(m => m.id === currentPage); if(idx > 1) setCurrentPage(menuItems[idx-1].id); }} className="px-3 py-1.5 md:px-6 md:py-2.5 text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm md:text-base font-bold flex items-center space-x-1 md:space-x-2 transition-all relative z-30 border border-slate-200"><Icons.ChevronLeft className="w-4 h-4 md:w-5 h-5"/> <span className="hidden md:inline">ย้อนกลับ</span></button>)}
                                {currentPage !== 'page14' && (<button onClick={() => { const idx = menuItems.findIndex(m => m.id === currentPage); if(idx > 0 && idx < menuItems.length - 1) setCurrentPage(menuItems[idx+1].id); }} className="px-3 py-1.5 md:px-6 md:py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm md:text-base font-bold flex items-center space-x-1 md:space-x-2 shadow-md transition-all relative z-30"><span className="hidden md:inline">หน้าถัดไป</span> <Icons.ChevronRight className="w-4 h-4 md:w-5 h-5"/></button>)}
                            </div>
                        </div>
                        )}
                        <div className="flex-1 p-4 md:p-6 lg:p-10 overflow-y-auto overflow-x-hidden w-full print:p-0 pb-24 scroll-smooth">
                            {renderPage({ currentPage, data, updateData, currentYear, setCurrentYear, calMonth, setCalMonth, calYear, setCalYear, activeCalMode, setActiveCalMode, selectedDrawSport, setSelectedDrawSport, selectedMatchSport, setSelectedMatchSport, selectedMedalSport, setSelectedMedalSport, isLoaded, setCurrentPage })}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminAuthWrapper><App /></AdminAuthWrapper>);
    </script>
</body>
</html>
